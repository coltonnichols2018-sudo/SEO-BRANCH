<!-- ==================== GLOBAL HEAD TAGS ==================== -->
<!--
  Add these to your theme.liquid file in the <head> section.
  In Shopify: Online Store > Themes > Actions > Edit Code > Layout > theme.liquid
-->

<!-- Geo Tags for Local SEO -->
<meta name="geo.region" content="US-KY">
<meta name="geo.placename" content="Louisville">
<meta name="geo.position" content="38.1814;-85.8221">
<meta name="ICBM" content="38.1814, -85.8221">

<!-- Open Graph Tags (Facebook/Social) -->
<meta property="og:site_name" content="Bubba's Mattress & Furniture">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_US">
<meta property="og:url" content="{{ canonical_url }}">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ page_description }}">
<meta property="og:image" content="{{ page_image | img_url: '1200x630' }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<!-- Twitter Card Tags -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page_title }}">
<meta name="twitter:description" content="{{ page_description }}">
<meta name="twitter:image" content="{{ page_image | img_url: '1200x630' }}">

<!-- Additional SEO Tags -->
<meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1">
<link rel="canonical" href="{{ canonical_url }}">
<meta name="author" content="Bubba's Mattress & Furniture">
<meta name="copyright" content="Bubba's Mattress & Furniture">
